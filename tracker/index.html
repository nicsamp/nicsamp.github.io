<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracker</title>

    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    
    <script src="script.js"></script>
</head>
<body>
    <header>
        <a href="./">Tracker</a>
    </header>

    <div class="content">
        <nav>
            <div class="nav-content">

            </div>
            <button class="open-nav-button">
                <i class="material-symbols-outlined">menu</i>
            </button>
        </nav>
        <div class="tracker">
            <div class="tracker-views">
                <button class="tracker-view-button selected" id="button-view-day">
                    <i class="material-symbols-outlined">calendar_today</i>
                </button>
                <button class="tracker-view-button" id="button-view-week">
                    <i class="material-symbols-outlined">date_range</i>
                </button>
                <button class="tracker-view-button" id="button-view-month">
                    <i class="material-symbols-outlined">calendar_month</i>
                </button>
            </div>
            <div class="tracker-and-controls">
                <button class="tracker-button-change-page" id="button-page-back">
                    <i class="material-symbols-outlined">arrow_back</i>
                </button>
                <div class="tracker-box">
                    <div class="tracker-actions">
                        <button id="button-action-today">
                            <i class="material-symbols-outlined">today</i>
                        </button>
                    </div>
                    <div class="tracker-content">
                        <div class="tracker-page" id="page-1">
                        </div>
                        <div class="tracker-page" id="page-2">
                        </div>
                    </div>
                </div>
                <button class="tracker-button-change-page" id="button-page-forward">
                    <i class="material-symbols-outlined">arrow_forward</i>
                </button>
            </div>
        </div>
    </div>
</body>
</html>
