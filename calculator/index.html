<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Math&family=Noto+Sans+Symbols+2&family=Noto+Sans+Symbols:wght@100..900&family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <script src="script.js"></script>
</head>
<body>
    <div class="app-box">
        <div class="calc-symbols">
            <i id="save-symbol" class="material-symbols-outlined symbol hidden">save</i>
            <i id="big-symbol" class="material-symbols-outlined symbol hidden">keyboard_double_arrow_up</i>
            <i id="error-symbol" class="material-symbols-outlined symbol hidden">error</i>
        </div>
        <p id="result">0</p>
        <table class="calc-buttons-table">
            <tr>
                <td><button class="calc-button calc-button-memory" onclick="memload()">↥</button></td>
                <td><button class="calc-button calc-button-memory" onclick="memsave()">↧</button></td>
                <td><button class="calc-button calc-button-memory" onclick="memclear()">↧⁰</button></td>
                <td><button class="calc-button calc-button-clear" onclick="del()"><</button></td>
                <td><button class="calc-button calc-button-clear" onclick="cl()">C</button></td>
            </tr>
            <tr>
                <td><button class="calc-button" onclick="one()">1</button></td>
                <td><button class="calc-button" onclick="two()">2</button></td>
                <td><button class="calc-button" onclick="three()">3</button></td>
                <td><button class="calc-button calc-button-operator" onclick="div()">÷</button></td>
                <td><button class="calc-button calc-button-operator" onclick="times()">×</button></td>
            </tr>
            <tr>
                <td><button class="calc-button" onclick="four()">4</button></td>
                <td><button class="calc-button" onclick="five()">5</button></td>
                <td><button class="calc-button" onclick="six()">6</button></td>
                <td><button class="calc-button calc-button-operator" onclick="plus()">+</button></td>
                <td><button class="calc-button calc-button-operator" onclick="minus()">-</button></td>
            </tr>
            <tr>
                <td><button class="calc-button" onclick="seven()">7</button></td>
                <td><button class="calc-button" onclick="eight()">8</button></td>
                <td><button class="calc-button" onclick="nine()">9</button></td>
                <td><button class="calc-button calc-button-operator" onclick="sqrt()">√</button></td>
                <td><button class="calc-button calc-button-operator" onclick="pow()">^</button></td>
                
            </tr>
            <tr>
                <td><button class="calc-button calc-button-modifier" onclick="point()">.</button></td>
                <td><button class="calc-button" onclick="zero()">0</button></td>
                <td><button class="calc-button calc-button-modifier" onclick="plusminus()">±</button></td>
                <td><button class="calc-button calc-button-modifier" onclick="pi()">π</button></td>
                <td><button class="calc-button calc-button-highlight" onclick="equal()">=</button></td>
            </tr>
        </table>
    </div>
</body>
</html>
