<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test</title>
    <link rel="stylesheet" href="style.css"><link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Math&family=Noto+Sans+Symbols+2&family=Noto+Sans+Symbols:wght@100..900&family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:FILL@1" rel="stylesheet" />
    <script src="script.js"></script>
</head>
<body>
    <div id="stopwatch">
        <p id="time">00 : 00 . 00</p>
        <ol id="laps-box">
        </ol>
        <div id="paused-buttons" class="button-container">
            <button type="button" id="play" class="action-button" onclick="play()"><i class="material-symbols-outlined" id="play-icon">play_arrow</i></button>
            <button type="button" id="reset" class="action-button reset-used" onclick="reset()"><i class="material-symbols-outlined" id="reset-icon">refresh</i></button>
        </div>
        <div id="playing-buttons" class="button-container hidden">
            <button type="button" id="pause" class="action-button" onclick="pause()"><i class="material-symbols-outlined" id="pause-icon">pause</i></button>
            <button type="button" id="lap" class="action-button" onclick="lap()"><i class="material-symbols-outlined" id="lap-icon">flag</i></button>
        </div>
    </div>
</body>
</html>
